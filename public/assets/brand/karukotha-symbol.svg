<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <!-- Karukotha Symbol - Inspired by nakshi kantha stitch pattern -->
  <rect width="100" height="100" rx="12" fill="#1B4332"/>
  <!-- Outer diamond weave pattern -->
  <path d="M50 15 L75 50 L50 85 L25 50 Z" stroke="#FAF7F2" stroke-width="2" fill="none"/>
  <path d="M50 22 L68 50 L50 78 L32 50 Z" stroke="#FAF7F2" stroke-width="1.5" fill="none"/>
  <path d="M50 29 L61 50 L50 71 L39 50 Z" stroke="#C1440E" stroke-width="1.5" fill="none"/>
  <!-- Inner running stitch dots -->
  <circle cx="50" cy="35" r="2" fill="#FAF7F2"/>
  <circle cx="50" cy="65" r="2" fill="#FAF7F2"/>
  <circle cx="35" cy="50" r="2" fill="#FAF7F2"/>
  <circle cx="65" cy="50" r="2" fill="#FAF7F2"/>
  <!-- Center stitch pattern -->
  <circle cx="50" cy="50" r="4" fill="#C1440E"/>
  <circle cx="50" cy="50" r="2" fill="#FAF7F2"/>
  <!-- Corner accents -->
  <path d="M20 20 L25 25" stroke="#D4A843" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M80 20 L75 25" stroke="#D4A843" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M20 80 L25 75" stroke="#D4A843" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M80 80 L75 75" stroke="#D4A843" stroke-width="1.5" stroke-linecap="round"/>
</svg>
